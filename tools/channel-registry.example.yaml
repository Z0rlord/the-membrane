# Phase 0 channel registry — local paths the gate may open.
permitted_channels:
  - local-llm

forbidden_exports:
  - cloud-telemetry
  - training-retention

model_allowlist:
  - sha256:demo-model

delta_t_secs: 300

# Model API base URL (chat/completions wire format at /v1/chat/completions; mock if unreachable)
model_api_url: http://127.0.0.1:8080

# Real GitHub connector (POST /v1/tools/invoke). Empty = deny all repos (fail closed).
# Example: github_repo_allowlist: ["your-org/disposable-pilot-repo"]
github_repo_allowlist: []
