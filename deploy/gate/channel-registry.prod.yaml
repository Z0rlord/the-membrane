# Production gate on relay-2 — local model backend in docker network
permitted_channels:
  - local-llm

forbidden_exports:
  - cloud-telemetry
  - training-retention

model_allowlist:
  - qwen2.5-0.5b-instruct

delta_t_secs: 300

model_api_url: http://llama:8080

# Keep empty on shared hosts unless an operator explicitly pilots a disposable repo.
# Public demo must never mount this connector with a token.
github_repo_allowlist: []
